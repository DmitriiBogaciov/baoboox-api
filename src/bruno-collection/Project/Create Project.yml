info:
  name: Create Project
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      mutation ($input: CreateProjectInput!) {
        createProject(input: $input) {
          name
          ownerId
          description
          slug
          type
          visibility
        }
      }
    variables: |-
      {
        "input": {
          "name": "First project",
          "description": "Fourth slug try"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: req.setHeader("Authorization", `Bearer ${bru.getEnvVar("accessToken")}`)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
