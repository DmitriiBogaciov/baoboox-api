info:
  name: Get Public Projects
  type: graphql
  seq: 9

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      query($input: PublicProjectQueryInput!){
        getPublicProjects(input: $input) {
          items{
            id
            name
          	ownerId
          	description
          	slug
         	 	type
            status
            visibility
          }
          page
          limit
          total
          totalPages
          hasNextPage
          hasPrevPage
        }
      }
    variables: |-
      {
        "input": {
          
        }
      }
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
