info:
  name: Update Owned Project
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      mutation ($projectId: String!, $input: UpdateOwnedProjectInput!){
        updateOwnedProject(projectId: $projectId, input: $input){
          id
          name
          ownerId
          description
          slug
          type
          status
          visibility
        }
      }
    variables: |-
      {
        "projectId": "cmt4t7yz60002ejxqxz7oua3w",
        "input": {
          "name": "AA First project"
        }
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: before-request
      code: req.setHeader('Authorization', `Bearer ${bru.getEnvVar('accessToken')}`)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
