info:
  name: Publish Project
  type: graphql
  seq: 6

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      mutation{
        publishProject(projectId: "6a4e1c0b9cf916ffaae4efb7")
        {
        	id
        	title
          description
          isPublished
        }
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: before-request
      code: req.setHeader('Authorization', `Bearer ${bru.getEnvVar('accessToken')}`);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
