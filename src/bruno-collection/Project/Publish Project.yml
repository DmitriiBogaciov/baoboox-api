info:
  name: Publish Project
  type: graphql
  seq: 6

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      mutation($projectId: String!){
        publishProject(projectId: $projectId)
        {
        	id
        	name
          description
          status
          visibility
          createdAt
          updatedAt
          publishedAt
          archivedAt
        }
      }
    variables: |-
      {
        "projectId": "cmt4t77n60001ejxqxzv5muo8"
      }
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: before-request
      code: req.setHeader('Authorization', `Bearer ${bru.getEnvVar('accessToken')}`);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
