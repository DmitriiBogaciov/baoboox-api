info:
  name: Get Projects
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      query($input: ProjectQueryInput!){
        getProjects(input: $input) {
          items{
            id
            name
          	ownerId
          	description
          	slug
         	 	type
            visibility
          }
          page
          limit
          total
          totalPages
          hasNextPage
          hasPrevPage
        }
      }
    variables: |-
      {
        "input": {
          
        }
      }
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: before-request
      code: req.setHeader('Authorization', `Bearer ${bru.getEnvVar('accessToken')}`)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
