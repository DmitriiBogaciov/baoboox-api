info:
  name: Find All
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      query {
        getUsers(
          input: {
            sort: {
              field: CREATED_AT
              direction: DESC
            }
          }
        ) {
          items {
          	id
          	email
          	firstName
            role
            createdAt
      		}
          total
          page
          limit
          totalPages
          hasNextPage
          hasPreviousPage
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
