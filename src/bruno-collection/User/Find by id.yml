info:
  name: Find by id
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      query {
        getUserById (
          id: "cmsteypfm0000pjxqop5hkmhd"
        ) {
          id
          email
          firstName
          role
          createdAt
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
