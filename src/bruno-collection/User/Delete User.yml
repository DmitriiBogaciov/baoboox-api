info:
  name: Delete User
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      mutation {
        deleteUser(
          input: {
            userId: "cmrphu8ur0000itxqf9zhowzt"
          }
        ) 
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: req.setHeader('Authorization', `Bearer ${bru.getEnvVar('accessToken')}`)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
