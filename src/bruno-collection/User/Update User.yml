info:
  name: Update User
  type: graphql
  seq: 6

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      mutation {
        updateUser(
          id: "cmsteypfm0000pjxqop5hkmhd",
          data: {
            firstName: "Dmitrii"
            lastName: "Bogaciov"
          }
        ){
          id
          firstName
          lastName
          role
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: req.setHeader('Authorization', `Bearer ${bru.getEnvVar('accessToken')}`)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
