info:
  name: Refresh
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      mutation {
        refresh
        {
          accessToken
          user {
            id
            firstName
            email
            role
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const accessToken = res.getBody().data.refresh.accessToken;
        bru.setEnvVar("accessToken", accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
