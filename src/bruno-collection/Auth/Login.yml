info:
  name: Login
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{host-gql}}"
  body:
    query: |-
      mutation {
        login(
          input: {
            email: "dmitrii.bogaciov@gmail.com"
            password: "123498765"
          }
        ) {
          accessToken
          user {
            id
            firstName
            email
            role
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const accessToken = res.getBody().data.login.accessToken;
        bru.setEnvVar("accessToken", accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
